[package]
name = "stufftracker"
version = "0.2.0"
edition = "2024"
[dependencies]
stufftracker-core = { path = "../core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

capnp = "0.20"
capnp-rpc = "0.20"
darude-runtime = { path = "../../vendor/darude/crates/runtime" }
anyhow = "1"
sha2 = "0.10"
futures = "0.3"
darude-wire = { path = "../../vendor/darude/crates/wire" }
[build-dependencies]
capnpc = "0.20"
darude-schema-docs = { path = "../../vendor/darude/crates/schema-docs" }
[dev-dependencies]
tokio-util = { version = "0.7", features = ["compat"] }
