id: stufftracker
name: StuffTracker
version: 0.2.0
# One grain = one inventory. Read shares may explore and export a snapshot;
# write shares may edit inventory and save views. HTTP and RPC enforce these rights.
rights: [read, write]
runtime:
  type: image
  image: "darude.local/stufftracker"
  archive: "img.tar"
  command: ["/stufftracker"]
routes:
  - path: /
    type: http
# App-owned schema is announced at ABI v2 registration, after SQLite and HTTP are ready.
api: stufftracker.v1
# No ambient network access or Home Assistant credentials are required.
