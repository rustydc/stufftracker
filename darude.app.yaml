id: stufftracker
name: StuffTracker
version: 0.2.0
# One grain = one inventory. Read shares may explore and export a snapshot;
# write shares may edit inventory and save views. HTTP and RPC enforce these rights.
rights: [read, write]
runtime:
  type: image
  image: "darude.local/stufftracker"
  archive: "img.tar"
  command: ["/stufftracker"]
routes:
  - path: /
    type: http
# App-owned schema is announced at ABI v2 registration, after SQLite and HTTP are ready.
api: stufftracker.v1
# No ambient network access or Home Assistant credentials are required.
#
# Live status comes through two optional slots the grain declares at
# registration, wired post-launch to the Home Assistant and Outline bridges:
#   home_assistant (homeassistant.v1, read): states for linked entities/areas
#   outline (outline.v1, read): titles and URLs for linked documents
# Read rights only: StuffTracker can show state but never call a service.
requires:
  # The reflective self-discovery handle: slot bindings are pulled from
  # Self.held() at startup and on every wiring change.
  self: { interface: self.v1, rights: [read] }
