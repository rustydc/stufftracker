[workspace]
members = ["crates/runtime", "crates/wire", "crates/schema-docs"]
resolver = "2"
[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false
[workspace.lints.clippy]
type_complexity = "allow"
[workspace.dependencies]
capnp = "0.20"
capnp-rpc = { version = "0.20", path = "vendor/capnp-rpc" }
capnpc = "0.20"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
anyhow = "1"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
