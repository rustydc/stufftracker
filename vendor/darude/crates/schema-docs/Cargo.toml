# Build-support: extract doc comments from .capnp SOURCES and inject
# them into a compiled CodeGeneratorRequest's sourceInfo, so the schema
# bytes that ride OpaqueCap.schema carry correctly-attributed docs.
# Used from build scripts (wire's, and any bridge crate that compiles
# its own schema); not linked into grains at runtime.
[package]
name = "darude-schema-docs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
capnp.workspace = true
