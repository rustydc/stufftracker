# Generated capnp types — the wire crate. All other crates depend on it
# for protocol types. Build script invokes capnpc to compile the .capnp
# files under platformd-rs/schemas/ into Rust modules.
[package]
name = "darude-wire"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
capnp.workspace = true
capnp-rpc.workspace = true

[build-dependencies]
darude-schema-docs = { path = "../schema-docs" }
capnpc.workspace = true
